# Local development database. Not for production.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: drphone
    ports:
      - "5432:5432"
    volumes:
      - drphone-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d drphone"]
      interval: 5s
      retries: 10

volumes:
  drphone-db:
