# Relevant server-block fragments; adapt paths and PHP socket to the VPS.
root /var/www/ministore/current/public;
index index.php;

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location ~ ^/uploads/.*\.(php[0-9]?|phtml|phar|cgi|pl|py|sh)$ {
    deny all;
}

location ~ \.php$ {
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass unix:/run/php/php8.2-fpm.sock;
}

location ~ /\. { deny all; }
location ~* \.(css|js)$ { expires 7d; add_header Cache-Control "public"; }
location ~* \.(jpg|jpeg|png|webp)$ { expires 30d; add_header Cache-Control "public"; }
